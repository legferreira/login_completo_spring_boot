<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head th:fragment="head(titulo)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${titulo} + ' | ' + ${nomeSistema}">Login Seguro</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{'/css/temas/' + ${tema} + '.css'}">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <nav class="navbar navbar-expand-md barra" th:fragment="navbar">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}" th:text="${nomeSistema}">Login Seguro</a>
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Início</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'GESTOR')">
                        <a class="nav-link" th:href="@{/gestor/painel}">Painel do gestor</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/usuarios}">Usuários</a>
                    </li>
                </ul>
                <span class="navbar-text me-3" sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-sm btn-sair">Sair</button>
                </form>
            </div>
        </nav>
    </body>
</html>
