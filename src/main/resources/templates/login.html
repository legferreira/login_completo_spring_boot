<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Login')}"></head>
    <body>
        <div class="caixa-central">
            <div class="cartao">
                <h3 class="mb-4 text-center" th:text="${nomeSistema}">Login Seguro</h3>

                <div class="alert alert-danger" th:if="${param.error}">E-mail ou senha inválidos.</div>
                <div class="alert alert-success" th:if="${param.logout}">Você saiu do sistema.</div>
                <div class="alert alert-success" th:if="${param.cadastro}">Cadastro realizado. Faça o login.</div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" required>
                    </div>
                    <button type="submit" class="btn btn-principal w-100">Entrar</button>
                </form>

                <div class="mt-3 text-center">
                    <a th:href="@{/cadastro}">Criar uma conta</a>
                </div>
            </div>
        </div>
    </body>
</html>
