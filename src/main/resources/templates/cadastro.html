<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Cadastro')}"></head>
    <body>
        <div class="caixa-central">
            <div class="cartao">
                <h3 class="mb-4 text-center">Criar conta</h3>

                <form th:action="@{/cadastro}" th:object="${usuario}" method="post">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" th:field="*{nome}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{nome}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{senha}"></div>
                    </div>
                    <button type="submit" class="btn btn-principal w-100">Cadastrar</button>
                </form>

                <div class="mt-3 text-center">
                    <a th:href="@{/login}">Já tenho uma conta</a>
                </div>
            </div>
        </div>
    </body>
</html>
